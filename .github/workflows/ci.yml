name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff
        run: python -m pip install "ruff==0.17.6"
      - name: Run Ruff
        run: ruff check src tests

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and sdist
        run: |
          python -m pip install "build>=1.2"
          python -m build
      - name: Check wheel contents
        run: |
          python -m zipfile -l dist/*.whl > wheel-contents.txt
          for kernel in collision interaction isotope scattering tetrahedron; do
            grep -q "phono3py_gpu/kernels/${kernel}.cu" wheel-contents.txt
          done
          python -m zipfile -e dist/*.whl wheel-contents
          grep -q "GPU = phono3py_gpu:register" \
            wheel-contents/phono3py_gpu-*.dist-info/entry_points.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-cpu:
    name: Test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install plugin and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Run CPU-only tests
        run: |
          python -m pytest -q \
            tests/test_registration.py \
            tests/test_initialization.py \
            tests/test_multigpu.py::test_worker_state_is_private \
            tests/test_multigpu.py::test_mapped_snapshot_is_copy_on_write \
            tests/test_kernels.py::test_band_block_for_free_memory
